# Triggered by `make release` / `make release-draft`.
# The release carries exactly the files `versline obsidian install` downloads: main.js, manifest.json, styles.css.
# Obsidian requires the tag to equal manifest.json's version (no "v" prefix).
name: Manual Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish immediately. Unchecked = draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Determine version
        run: echo "RELEASE_VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_ENV"
      - name: Remove existing release and tag if exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_VERSION" --cleanup-tag --yes || true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Versobs ${{ env.RELEASE_VERSION }}
          draft: ${{ !inputs.publish }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            main.js
            manifest.json
            styles.css
